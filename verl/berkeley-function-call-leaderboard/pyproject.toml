[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bfcl_eval"
version = "0.0.0"
description = "BFCL task execution and reward dependencies for WER training"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "requests", "tqdm", "numpy<2.0.0", "pandas", "python-dotenv>=1.0.1",
    "openai>=1.86.0", "tenacity>=8.5.0", "overrides", "mpmath==1.3.0",
    "filelock>=3.20.0", "tree_sitter==0.21.3", "tree-sitter-java==0.21.0",
    "tree-sitter-javascript==0.21.4", "wandb"
]

[tool.setuptools.packages.find]
include = ["bfcl_eval*"]

[tool.setuptools.package-data]
bfcl_eval = ["data/**/*"]
